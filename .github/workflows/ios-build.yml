name: iOS Build (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode / SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: Install XcodeGen (from official release, no Homebrew)
        run: |
          set -euo pipefail
          curl -fSL -o xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q xcodegen.zip -d xcodegen-dist
          XG_BIN="$(find xcodegen-dist -type f -name xcodegen -path '*/bin/*' | head -1)"
          echo "Found XcodeGen at: $XG_BIN"
          "$XG_BIN" --version
          echo "XCODEGEN_BIN=$XG_BIN" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          "$XCODEGEN_BIN" generate --spec project.yml

      - name: List schemes
        run: xcodebuild -list -project iVoice.xcodeproj

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project iVoice.xcodeproj \
            -scheme iVoice \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/iVoice.app"
          if [ ! -d "$APP_PATH" ]; then echo "App not found at $APP_PATH"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry iVoice-unsigned.ipa Payload
          echo "Built IPA:"; ls -lh iVoice-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iVoice-unsigned-ipa
          path: iVoice-unsigned.ipa
          if-no-files-found: error
